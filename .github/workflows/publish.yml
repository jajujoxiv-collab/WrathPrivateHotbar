name: Publish WrathPrivateHotbar to Dalamud

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Fetch Dalamud dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://goatcorp.github.io/dalamud-distrib/latest.zip'
          $destination = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Invoke-WebRequest -Uri $url -OutFile 'dalamud-latest.zip'
          Expand-Archive -Path 'dalamud-latest.zip' -DestinationPath $destination -Force

      - name: Build plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build 'Plugin/WrathPrivateHotbar.csproj' -c Release -p:Platform=x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed: $LASTEXITCODE" }

      - name: Package and prepare Dalamud repository metadata
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = 'Plugin/WrathPrivateHotbar.json'
          $manifest = Get-Content $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $version = [string]$manifest.AssemblyVersion
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Unexpected AssemblyVersion: $version" }
          $tag = "v$version"
          $repo = $env:GITHUB_REPOSITORY
          $download = "https://github.com/$repo/releases/download/$tag/latest.zip"

          $dll = 'Plugin/bin/x64/Release/WrathPrivateHotbar.dll'
          if (!(Test-Path $dll)) { throw "Built DLL missing: $dll" }
          $target = 'dist/WrathPrivateHotbar'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item $dll (Join-Path $target 'WrathPrivateHotbar.dll')
          Copy-Item $manifestPath (Join-Path $target 'WrathPrivateHotbar.json')
          $pdb = 'Plugin/bin/x64/Release/WrathPrivateHotbar.pdb'
          if (Test-Path $pdb) { Copy-Item $pdb (Join-Path $target 'WrathPrivateHotbar.pdb') }
          # Dalamud expects DLL and manifest at the root of latest.zip.
          # Packaging the enclosing directory adds an extra folder and breaks installation.
          Compress-Archive -Path (Join-Path $target '*') -DestinationPath 'dist/latest.zip' -Force
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist/latest.zip').Path)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @('WrathPrivateHotbar.dll', 'WrathPrivateHotbar.json')) {
              if ($entries -notcontains $required) { throw "Missing ZIP root entry: $required. Actual: $($entries -join ', ')" }
            }
            Write-Host "Validated ZIP root entries: $($entries -join ', ')"
          } finally {
            $archive.Dispose()
          }

          $entry = [ordered]@{
            Author = [string]$manifest.Author
            Name = [string]$manifest.Name
            InternalName = [string]$manifest.InternalName
            Punchline = [string]$manifest.Punchline
            Description = [string]$manifest.Description
            Changelog = [string]$manifest.Changelog
            AssemblyVersion = $version
            ApplicableVersion = [string]$manifest.ApplicableVersion
            DalamudApiLevel = [int]$manifest.DalamudApiLevel
            RepoUrl = "https://github.com/$repo"
            IsHide = $false
            IsTestingExclusive = $false
            DownloadLinkInstall = $download
            DownloadLinkUpdate = $download
            DownloadLinkTesting = $download
            LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          }
          # On an in-place package repair, keep any edited public description.
          if (Test-Path 'pluginmaster.json') {
            $previousEntries = @(Get-Content 'pluginmaster.json' -Raw -Encoding UTF8 | ConvertFrom-Json)
            if ($previousEntries.Count -gt 0 -and [string]$previousEntries[0].AssemblyVersion -eq $version) {
              if ($previousEntries[0].Punchline) { $entry.Punchline = [string]$previousEntries[0].Punchline }
              if ($previousEntries[0].Description) { $entry.Description = [string]$previousEntries[0].Description }
            }
          }
          $json = ConvertTo-Json -InputObject @($entry) -Depth 8
          Set-Content -Path 'pluginmaster.json' -Value $json -Encoding utf8
          Write-Host "Version: $version; release tag: $tag"
          Write-Host "Dalamud URL: https://raw.githubusercontent.com/$repo/main/pluginmaster.json"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish or repair GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.meta.outputs.tag }}'
          $repo = $env:GITHUB_REPOSITORY
          # gh release view returns an error when this is a brand-new version; that is expected.
          $existing = gh release list --repo $repo --limit 100 --json tagName | ConvertFrom-Json
          if (@($existing | Where-Object { $_.tagName -eq $tag }).Count -gt 0) {
            # Re-upload the corrected latest.zip to the SAME release tag, no version bump required.
            gh release upload $tag 'dist/latest.zip' --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not replace existing release asset' }
            Write-Host "Repaired release ${tag}: replaced latest.zip"
          } else {
            gh release create $tag 'dist/latest.zip' --repo $repo --target main --title "WrathPrivateHotbar $tag" --notes "WrathPrivateHotbar $tag : Dalamud custom repository release." --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
            Write-Host "Created release $tag"
          }

      - name: Publish pluginmaster.json to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pluginmaster.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'pluginmaster.json is unchanged.'
          } else {
            git commit -m "Publish WrathPrivateHotbar ${{ steps.meta.outputs.tag }}"
            if ($LASTEXITCODE -ne 0) { throw 'Git commit failed' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Git push failed. Check Actions workflow permissions and branch protection.' }
          }
